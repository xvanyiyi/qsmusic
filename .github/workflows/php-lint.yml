name: PHP Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, sqlite3, mbstring
          coverage: none

      - name: Syntax check (php -l)
        run: |
          fail=0
          while IFS= read -r f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; fail=1; }
          done < <(find src public bin config -type f \( -name '*.php' -o -name 'qsmusic' \) ! -name '*.example')
          exit $fail

      - name: Autoload sanity
        run: php -r 'require "src/autoload.php"; print "autoload ok" . PHP_EOL;'

      - name: Node syntax check (sidecar)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        continue-on-error: true

      - run: node --check signer/server.js
